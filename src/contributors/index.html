<!-- contributors/index.html -->
<!DOCTYPE html>
<html lang="en" data-theme="corporate_festive_golden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Contributors</title>
    
    <!-- SVG Goose Portraits -->
    <link rel="stylesheet" href="/contributors/svg/goose_portrait_2.svg">
    <link rel="stylesheet" href="/contributors/svg/goose_portrait_3.svg">

    <style>
        :root {
            --corporate-blue: #0f172a; /* AgentPipe Blue */
            --golden-yellow: #ffeb3b;   /* Golden Egg Yellow */
            --gold-glow: rgba(255, 235, 59, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding-bottom: 120px; /* Space for golden eggs */
        }

        header.hero-section {
            text-align: center;
            padding-top: 60px;
            position: relative;
        }

        .hero-image-container {
            width: 80%;
            max-width: 1200px;
            margin: 40px auto;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* SVG Goose Portraits */
        svg.goose-portrait-2 {
            filter: url(#gooseFilter_4) !important;
        }
        
        svg.goose-portrait-3 {
            filter: url(#gooseFilter_5) !important;
        }

        /* Decorative Golden Eggs */
        .golden-egg-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -9999;
        }

        .golden-egg {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--corporate-blue) 4px, transparent 6px);
            opacity: 0.8;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(150vh) scale(2); opacity: 0; }
            30% { transform: translateY(-40px) scale(1.2); opacity: 0.8; z-index: -999;} /* Hover effect */
            70% { transform: translateY(50vh) scale(1.1); opacity: 0.6; }
            100% { transform: translateY(-30px) scale(2); opacity: 0; z-index: -89;} /* Fade out */
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section.hero-section > * {
            animation: slideUpFade 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title h2 {
            color: var(--corporate-blue);
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .hero-title h2 span { color: var(--golden-yellow); }

        /* Grid Layout */
        .contributor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            padding-bottom: 80px;
        }
